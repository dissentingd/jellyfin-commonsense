[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jellyfin-commonsense"
version = "0.0.1"
description = "Re-rate a Jellyfin library to modern parental-rating standards, with a restorable ledger"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "dissentingd" }]
keywords = ["jellyfin", "parental-controls", "content-rating", "common-sense-media", "media-server"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/dissentingd/jellyfin-commonsense"
Issues = "https://github.com/dissentingd/jellyfin-commonsense/issues"

[project.scripts]
jellyfin-commonsense = "jellyfin_commonsense.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jellyfin_commonsense"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
