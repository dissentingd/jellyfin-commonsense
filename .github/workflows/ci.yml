name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build jellyfin-ratings-fixer.sln -c Release
      - run: dotnet test jellyfin-ratings-fixer.sln -c Release --no-build
      - run: dotnet publish Jellyfin.Plugin.RatingsFixer -c Release --no-build -o out
      - uses: actions/upload-artifact@v4
        with:
          name: jellyfin-ratings-fixer
          path: out/Jellyfin.Plugin.RatingsFixer.dll
